# Ender 3 (Bowden, Serien-Hotend) - Turbo fuer PLA
# Begrenzt durch den Fluss des Serien-Hotends: max. 12 mm3/s bei 220 Grad.
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.24
gcode_flavor = marlin2
use_relative_e_distances = 1
layer_gcode = G92 E0
# 0,28 mm Schicht, 0,45 mm Linie -> 0,126 mm2 Querschnitt
layer_height = 0.28
first_layer_height = 0.28
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeters = 2
top_solid_layers = 3
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_every_layers = 2
brim_width = 5
skirts = 0
# Fluss: 12 mm3/s / 0,126 mm2 = ~95 mm/s Obergrenze; Slicer drosselt automatisch
max_volumetric_speed = 12
max_volumetric_extrusion_rate_slope_positive = 0
temperature = 220
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
extrusion_multiplier = 1
# Geschwindigkeiten
perimeter_speed = 90
external_perimeter_speed = 60
small_perimeter_speed = 40
infill_speed = 120
solid_infill_speed = 90
top_solid_infill_speed = 50
gap_fill_speed = 40
bridge_speed = 40
travel_speed = 180
first_layer_speed = 30
max_print_speed = 120
# Beschleunigung: mehr verkraftet der Ender-Rahmen nicht ohne Ringing
default_acceleration = 1500
perimeter_acceleration = 1000
infill_acceleration = 2000
bridge_acceleration = 1000
first_layer_acceleration = 500
travel_acceleration = 2000
machine_limits_usage = emit_to_gcode
machine_max_acceleration_x = 2000
machine_max_acceleration_y = 2000
machine_max_acceleration_extruding = 2000
machine_max_acceleration_travel = 2000
machine_max_acceleration_retracting = 1000
machine_max_feedrate_x = 200
machine_max_feedrate_y = 200
machine_max_feedrate_z = 10
machine_max_feedrate_e = 60
machine_max_jerk_x = 10
machine_max_jerk_y = 10
machine_max_jerk_e = 5
# Rueckzug Bowden
retract_length = 5
retract_speed = 45
retract_lift = 0
avoid_crossing_perimeters = 0
only_retract_when_crossing_perimeters = 1
# Kuehlung: Turbo braucht volle Luft
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 4
min_print_speed = 15
start_gcode = G90\nM82\nM140 S[first_layer_bed_temperature]\nM104 S150\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z2.0 F3000\nG1 X0.1 Y20 Z0.3 F5000\nG1 X0.1 Y200 Z0.3 F1500 E15\nG1 X0.4 Y200 Z0.3 F5000\nG1 X0.4 Y20 Z0.3 F1500 E30\nG92 E0\nG1 Z2.0 F3000\nM83
end_gcode = G91\nG1 E-2 F2700\nG1 Z10 F3000\nG90\nG1 X0 Y200 F3000\nM106 S0\nM104 S0\nM140 S0\nM84 X Y E
