# Filamentwechsler für 2 Filamente mit 28BYJ-48-Zufuhr
# ====================================================
#
# Einbinden in printer.cfg:   [include wechsler.cfg]
#
# Hardware:
#   - Raspberry Pi Pico (RP2040) mit Klipper-Firmware als zweite Platine
#   - 2 Schrittmotortreiber (A4988 oder TMC2208 standalone) für die 28BYJ-48,
#     Motoren auf bipolar umgebaut (siehe README.md, Abschnitt 5)
#   - 2 Servos SG90/MG90S für die Spannhebel
#   - 1 Mikroschalter in der Y-Weiche, parallel an DREI Pins des Pico
#     (je einer als Endschalter pro Zufuhr und einer als Sensor für die Anzeige)
#
# Alle Wege sind Startwerte. Kalibrieren nach WECHSLER.md, Abschnitt 4.

[mcu wechsler]
# ls /dev/serial/by-id/   zeigt den richtigen Namen
serial: /dev/serial/by-id/usb-Klipper_rp2040_HIER_EINTRAGEN-if00

# Der Ender muss Filament über den ganzen Bowden-Schlauch zurückziehen dürfen.
# Diese Zeile in den vorhandenen [extruder]-Abschnitt der printer.cfg
# übernehmen (nicht hier doppelt anlegen):
#   max_extrude_only_distance: 600

# --- Zufuhr 0 ---------------------------------------------------------------

[manual_stepper zufuhr0]
step_pin: wechsler:gpio2
dir_pin: wechsler:gpio3
enable_pin: !wechsler:gpio4
# A4988: MS1-MS3 auf High = 16; TMC2208 standalone ohne Brücken = 8
microsteps: 16
full_steps_per_rotation: 32
# 28BYJ-48-Getriebe, dann Ritzel : Rad (Wechsler 1 : 1)
gear_ratio: 63.684:1, 31:31
# pi × wirksamer Durchmesser der Rändel; kalibrieren
rotation_distance: 43.2
velocity: 10
accel: 50
# Mikroschalter der Weiche, schließt gegen GND, wenn Filament drin ist
endstop_pin: ^!wechsler:gpio10

[servo klemme0]
pin: wechsler:gpio14
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

# --- Zufuhr 1 ---------------------------------------------------------------

[manual_stepper zufuhr1]
step_pin: wechsler:gpio6
dir_pin: wechsler:gpio7
enable_pin: !wechsler:gpio8
microsteps: 16
full_steps_per_rotation: 32
gear_ratio: 63.684:1, 31:31
rotation_distance: 43.2
velocity: 10
accel: 50
endstop_pin: ^!wechsler:gpio11

[servo klemme1]
pin: wechsler:gpio15
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

# --- Sensor in der Weiche (nur Anzeige und Prüfung) -------------------------

[filament_switch_sensor weiche]
switch_pin: ^!wechsler:gpio12
pause_on_runout: False

# --- Einstellungen ----------------------------------------------------------

[gcode_macro WECHSLER]
description: Einstellungen und Zustand des Filamentwechslers
# geladenes Filament: -1 = keins, 0 oder 1
variable_aktiv: -1
# Düse bis knapp hinter die Zahnräder des Ender-Extruders (+15 mm)
variable_entladen_weg: 470
# Ender-Extruder bis zur Düse
variable_laden_weg: 450
# Schalter in der Weiche bis zu den Zahnrädern des Ender-Extruders
variable_sensor_bis_extruder: 60
# nach dem Schalter noch so weit zurück, dass die Spitze hinter dem
# Zusammenlauf parkt
variable_park_weg: 25
# so weit sucht die Zufuhr höchstens nach dem Schalter
variable_suchweg: 250
# gemeinsamer Weg von Zufuhr und Ender-Extruder beim Einfädeln
variable_uebergabe_weg: 20
# Geschwindigkeiten in mm/s
variable_zufuhr_v: 8
variable_extruder_v: 35
# Servowinkel: angedrückt / frei (mit SERVO_TEST ermitteln)
variable_servo_zu: 60
variable_servo_offen: 100
gcode:
  {% set w = printer["gcode_macro WECHSLER"] %}
  {% set sensor = printer["filament_switch_sensor weiche"].filament_detected %}
  RESPOND MSG="Wechsler: geladen {w.aktiv}, Filament in der Weiche: {sensor}"

# --- Befehle für den Slicer -------------------------------------------------

[gcode_macro T0]
gcode:
  WECHSEL ZIEL=0

[gcode_macro T1]
gcode:
  WECHSEL ZIEL=1

[gcode_macro WECHSEL]
description: Wechselt auf Filament ZIEL (0 oder 1)
gcode:
  {% set w = printer["gcode_macro WECHSLER"] %}
  {% set ziel = params.ZIEL|int %}
  {% if ziel != w.aktiv %}
    SAVE_GCODE_STATE NAME=wechsel
    M83
    {% if w.aktiv >= 0 %}
      _ENTLADEN T={w.aktiv}
    {% endif %}
    _LADEN T={ziel}
    SET_GCODE_VARIABLE MACRO=WECHSLER VARIABLE=aktiv VALUE={ziel}
    RESTORE_GCODE_STATE NAME=wechsel
  {% endif %}

[gcode_macro WECHSLER_ENTLADEN]
description: Zieht das geladene Filament zurück in die Parkposition
gcode:
  {% set w = printer["gcode_macro WECHSLER"] %}
  {% if w.aktiv >= 0 %}
    SAVE_GCODE_STATE NAME=entladen
    M83
    _ENTLADEN T={w.aktiv}
    SET_GCODE_VARIABLE MACRO=WECHSLER VARIABLE=aktiv VALUE=-1
    RESTORE_GCODE_STATE NAME=entladen
  {% endif %}

[gcode_macro WECHSLER_SETZEN]
description: Teilt dem Wechsler mit, welches Filament gerade geladen ist (T=-1, 0, 1)
gcode:
  SET_GCODE_VARIABLE MACRO=WECHSLER VARIABLE=aktiv VALUE={params.T|int}

# --- Ablauf -----------------------------------------------------------------

[gcode_macro _KLEMME]
gcode:
  {% set w = printer["gcode_macro WECHSLER"] %}
  {% set t = params.T|int %}
  {% if params.ZU|int == 1 %}
    SET_SERVO SERVO=klemme{t} ANGLE={w.servo_zu}
  {% else %}
    SET_SERVO SERVO=klemme{t} ANGLE={w.servo_offen}
  {% endif %}
  G4 P400
  {% if params.ZU|int == 0 %}
    # Servo stromlos schalten, er muss im Druck nichts halten
    SET_SERVO SERVO=klemme{t} WIDTH=0
  {% endif %}

[gcode_macro _ENTLADEN]
gcode:
  {% set w = printer["gcode_macro WECHSLER"] %}
  {% set t = params.T|int %}
  # 1. Der Ender-Extruder zieht das Filament aus Düse und Bowden, bis die
  #    Spitze knapp hinter seinen Zahnrädern liegt. Die Zufuhr ist offen.
  G1 E-{w.entladen_weg} F{w.extruder_v * 60}
  M400
  # 2. Die Zufuhr greift und zieht zurück, bis der Schalter frei wird ...
  _KLEMME T={t} ZU=1
  MANUAL_STEPPER STEPPER=zufuhr{t} ENABLE=1
  MANUAL_STEPPER STEPPER=zufuhr{t} SET_POSITION=0
  MANUAL_STEPPER STEPPER=zufuhr{t} MOVE=-{w.suchweg} SPEED={w.zufuhr_v} STOP_ON_ENDSTOP=-1
  # 3. ... und parkt die Spitze hinter dem Zusammenlauf.
  MANUAL_STEPPER STEPPER=zufuhr{t} SET_POSITION=0
  MANUAL_STEPPER STEPPER=zufuhr{t} MOVE=-{w.park_weg} SPEED={w.zufuhr_v}
  MANUAL_STEPPER STEPPER=zufuhr{t} ENABLE=0
  _KLEMME T={t} ZU=0

[gcode_macro _LADEN]
gcode:
  {% set w = printer["gcode_macro WECHSLER"] %}
  {% set t = params.T|int %}
  # 1. Die Zufuhr schiebt, bis das Filament den Schalter drückt ...
  _KLEMME T={t} ZU=1
  MANUAL_STEPPER STEPPER=zufuhr{t} ENABLE=1
  MANUAL_STEPPER STEPPER=zufuhr{t} SET_POSITION=0
  MANUAL_STEPPER STEPPER=zufuhr{t} MOVE={w.suchweg} SPEED={w.zufuhr_v} STOP_ON_ENDSTOP=1
  # 2. ... dann bis kurz vor die Zahnräder des Ender-Extruders.
  MANUAL_STEPPER STEPPER=zufuhr{t} SET_POSITION=0
  MANUAL_STEPPER STEPPER=zufuhr{t} MOVE={w.sensor_bis_extruder - 5} SPEED={w.zufuhr_v}
  # 3. Beide schieben gemeinsam, bis der Ender-Extruder das Filament greift.
  MANUAL_STEPPER STEPPER=zufuhr{t} SET_POSITION=0
  MANUAL_STEPPER STEPPER=zufuhr{t} MOVE={w.uebergabe_weg} SPEED={w.zufuhr_v} SYNC=0
  G1 E{w.uebergabe_weg} F{w.zufuhr_v * 60}
  M400
  # 4. Zufuhr loslassen, der Ender-Extruder schiebt bis zur Düse.
  _KLEMME T={t} ZU=0
  MANUAL_STEPPER STEPPER=zufuhr{t} ENABLE=0
  G1 E{w.laden_weg} F{w.extruder_v * 60}

# --- Hilfen zum Einrichten --------------------------------------------------

[gcode_macro SERVO_TEST]
description: Stellt einen Servo auf einen Winkel, z. B. SERVO_TEST T=0 WINKEL=60
gcode:
  SET_SERVO SERVO=klemme{params.T|int} ANGLE={params.WINKEL|float}

[gcode_macro ZUFUHR_TEST]
description: Bewegt eine Zufuhr um WEG mm (mit angedrücktem Hebel), z. B. ZUFUHR_TEST T=0 WEG=100
gcode:
  {% set w = printer["gcode_macro WECHSLER"] %}
  {% set t = params.T|int %}
  _KLEMME T={t} ZU=1
  MANUAL_STEPPER STEPPER=zufuhr{t} ENABLE=1
  MANUAL_STEPPER STEPPER=zufuhr{t} SET_POSITION=0
  MANUAL_STEPPER STEPPER=zufuhr{t} MOVE={params.WEG|float} SPEED={w.zufuhr_v}
  MANUAL_STEPPER STEPPER=zufuhr{t} ENABLE=0
  _KLEMME T={t} ZU=0
