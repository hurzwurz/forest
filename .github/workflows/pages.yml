# Veröffentlicht die App auf GitHub Pages.
#
# Nur von `main` aus. Die Umgebung `github-pages` lässt standardmäßig allein
# den Standard-Branch veröffentlichen; von einem Feature-Branch wird der Job
# abgewiesen, bevor er startet -- ohne Protokoll, was wie ein Defekt aussieht.
#
# Voraussetzung ist einmalig: Settings → Pages → Source: GitHub Actions.
#
# Pages liefert nur fertige Dateien aus, kann also keinen Server starten.
# Das macht nichts: Findet die App keine API, schaltet sie selbst in den
# Offline-Betrieb und rechnet im Browser. Wer die gemeinsame Welt will,
# stellt zusätzlich den Server nach README auf (Render oder Fly.io).

name: Seite veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig, aber eine laufende auch nicht
# abbrechen -- halb ausgerollt wäre schlimmer als kurz veraltet.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.ausrollen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Schaltet Pages beim ersten Lauf selbst ein.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: ausrollen
        uses: actions/deploy-pages@v4
