# Fly.io -- empfohlen, weil es ein dauerhaftes Laufwerk gibt.
# Die Welt liegt in einer SQLite-Datei; ohne Laufwerk wäre sie nach jedem
# Ausrollen weg.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create forest_data --size 1
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32)
#   fly deploy

app = "forest-ar"
primary_region = "fra"          # Frankfurt; siehe `fly platform regions`

[build]

[env]
  PORT = "3000"
  DB_FILE = "/data/forest.db"

[[mounts]]
  source = "forest_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true            # die Kamera braucht HTTPS
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
